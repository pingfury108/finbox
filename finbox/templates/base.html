<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="60">
  <title>{% block title %}finbox{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0f1419; color: #e6e6e6; margin: 0; }
    nav { background: #1a2129; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    nav a { color: #8ab4f8; text-decoration: none; }
    nav .brand { color: #fff; font-weight: 700; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .card { background: #1a2129; border-radius: 8px; padding: 16px 24px; flex: 1; min-width: 180px; }
    .card .label { color: #9aa0a6; font-size: 13px; }
    .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #1a2129; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 14px; border-bottom: 1px solid #2a333d; }
    th { color: #9aa0a6; font-weight: 500; }
    .up { color: #f34f4f; } .down { color: #2ecc71; }
    h2 { font-size: 17px; color: #c9d1d9; }
    details { background: #12181f; border-radius: 6px; padding: 8px 12px; margin-top: 6px; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #9aa0a6; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #2a333d; }
    button { background: #8ab4f8; color: #0f1419; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    select { background: #1a2129; color: #e6e6e6; border: 1px solid #2a333d; border-radius: 6px; padding: 6px 10px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">finbox</span>
    <a href="/">概览</a>
    <a href="/history">行情</a>
    <a href="/trades">交易记录</a>
    <a href="/decisions">AI 决策</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
